name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: lint is non-blocking for now — app/ and components/ carry pre-existing
      # lint errors that are being fixed in parallel branches (refactor/components-i18n-a11y,
      # chore/seo-metadata-hygiene, feat/en-methodology-team). Flip continue-on-error to
      # false (or remove it) once those merge so lint becomes a hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Recompute model (invariant audit)
        run: npm run recompute
