<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Left: pipe (red) -->
  <path d="M16,0 H7 Q0,0 0,7 V25 Q0,32 7,32 H16 Z" fill="#dc2626"/>
  <!-- Right: field (green) -->
  <path d="M16,0 H25 Q32,0 32,7 V25 Q32,32 25,32 H16 Z" fill="#16a34a"/>

  <!-- Pipe: single locked path with arrow -->
  <line x1="8" y1="7" x2="8" y2="18.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="5.5,16.5 8,21.5 10.5,16.5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Field: three dots = infinite compliant paths -->
  <circle cx="21" cy="9" r="2.8" fill="white"/>
  <circle cx="26.5" cy="17" r="2.8" fill="white"/>
  <circle cx="20" cy="25" r="2.8" fill="white"/>
</svg>
